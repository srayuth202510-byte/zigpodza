name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --prune --depth=1 origin "${GITHUB_SHA}"
          git checkout --force "${GITHUB_SHA}"

      - name: Setup Zig 0.17.1
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/zig.tar.xz https://ziglang.org/download/0.17.1/zig-x86_64-linux-0.17.1.tar.xz
          echo "3581863e3cbcfd0fce0efc682ce7e9e93da96668a977791d356a26d2a7e9b17a  /tmp/zig.tar.xz" | sha256sum -c -
          sudo tar -xJf /tmp/zig.tar.xz -C /opt
          sudo ln -sf /opt/zig-x86_64-linux-0.17.1/zig /usr/local/bin/zig
          rm -f /tmp/zig.tar.xz
          zig version

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Run unit tests
        run: zig build test

      - name: Build ReleaseSafe binary
        run: zig build -Doptimize=ReleaseSafe

      - name: Run security and hardening checks
        run: ./scripts/security-check.sh --require-zig

      - name: Run CI parity check
        run: python3 scripts/check-ci-parity.py

      - name: Run smoke and knowledge graph checks
        run: |
          python3 scripts/graph-query.py update
          python3 scripts/graph-query.py query "memory"
          sh scripts/smoke.sh
